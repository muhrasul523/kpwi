<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tag untuk link preview WA -->
    <meta property="og:title" content="Input Kegiatan KSBK - Wahdah Islamiyah">
    <meta property="og:description" content="Aplikasi pengontrolan kinerja pegawai Kantor Pusat Wahdah Islamiyah.">
    <meta property="og:image" content="../../monitoring_kinerja_pegawai.png">
    
    <title>Input Kegiatan KSBK</title>
    <link rel="icon" type="image/png" href="../../logo_wahdah_islamiyah.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { blue: '#1e3a8a', gold: '#eab308' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #ffffff 100%); min-height: 100vh; color: #1e293b; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 40px rgba(30, 58, 138, 0.08); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .ts-control { border-radius: 0.75rem; padding: 0.65rem 1rem; border: 1px solid #cbd5e1; background-color: #f8fafc; font-size: 1rem; }
        .ts-control.focus { border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15); background-color: #ffffff; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        .keep-multiline { white-space: pre-wrap; line-height: 1.5; }
        
        /* Tab Styles */
        .tab-btn { transition: all 0.3s; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #1e3a8a; border-bottom: 2px solid #eab308; font-weight: 700; background: rgba(30,58,138,0.05); }
    </style>
</head>
<body class="antialiased selection:bg-brand-gold selection:text-brand-blue" onload="loadData()">

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="fixed inset-0 bg-brand-blue z-[9999] flex flex-col items-center justify-center text-white transition-all duration-300">
        <img src="../../logo_wahdah_islamiyah.png" alt="Logo Wahdah" class="h-28 mb-8 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] animate-pulse" onerror="this.src='https://via.placeholder.com/150x150?text=Logo'">
        <div class="w-72 max-w-[80vw] h-2.5 bg-blue-900 rounded-full overflow-hidden shadow-inner border border-blue-800">
            <div class="h-full bg-gradient-to-r from-brand-gold to-yellow-300 w-full animate-[pulse_1s_ease-in-out_infinite] shadow-[0_0_10px_rgba(234,179,8,0.8)]"></div>
        </div>
        <p class="mt-4 text-sm font-medium text-blue-200" id="loadingText">Memuat Sistem...</p>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- HEADER (GLOBAL) -->
        <div class="text-center mb-6 fade-in hidden" id="headerLogo">
            <img src="../../logo_wahdah_islamiyah.png" alt="Logo Wahdah" class="h-16 mx-auto mb-3 drop-shadow-xl" onerror="this.style.display='none'">
            <h1 class="text-2xl md:text-3xl font-extrabold text-brand-blue tracking-tight">Kinerja Pegawai</h1>
            <p class="text-gray-500 mt-1 text-sm font-medium">Kantor Pusat Wahdah Islamiyah</p>
        </div>

        <!-- 1. VIEW LOGIN -->
        <div id="loginView" class="max-w-md mx-auto glass-panel rounded-2xl p-8 fade-in border-t-4 border-t-brand-blue hidden mt-10">
            <h2 class="text-xl font-bold text-center text-brand-blue mb-2"><i class="fa-solid fa-right-to-bracket mr-2 text-brand-gold"></i>Login KSBK</h2>
            <p class="text-sm text-center text-gray-500 mb-6">Masukkan nomor WhatsApp Anda yang terdaftar.</p>
            <form onsubmit="handleLogin(event)">
                <div class="mb-5">
                    <label class="block text-sm font-bold text-brand-blue mb-1.5"><i class="fa-brands fa-whatsapp text-green-500 text-base mr-1"></i> Nomor WhatsApp</label>
                    <input type="text" id="loginWa" required class="w-full rounded-xl border-gray-300 border bg-white px-3.5 py-3 focus:ring-4 focus:ring-blue-100 outline-none text-gray-700 font-medium" placeholder="Contoh: 08123456789" oninput="formatWA(this)">
                </div>
                <button type="submit" class="w-full bg-brand-blue hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                    Masuk <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- 2. VIEW PILIH BIDANG -->
        <div id="pilihBidangView" class="max-w-md mx-auto glass-panel rounded-2xl p-8 fade-in border-t-4 border-t-brand-gold hidden mt-10">
            <h2 class="text-xl font-bold text-center text-brand-blue mb-2">Pilih Bidang Kerja</h2>
            <p class="text-sm text-center text-gray-500 mb-6" id="welcomePilihBidang">Selamat datang,</p>
            <div id="listBidang" class="space-y-3">
                <!-- Buttons injected here -->
            </div>
            <button onclick="logout()" class="mt-6 w-full text-red-500 hover:text-red-700 text-sm font-medium transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Batal & Kembali
            </button>
        </div>

        <!-- 3. MAIN APP VIEW -->
        <div id="mainAppView" class="hidden fade-in">
            
            <!-- User Info Card -->
            <div class="max-w-4xl mx-auto bg-gradient-to-r from-brand-blue to-blue-800 rounded-2xl p-5 mb-6 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center border border-white/30">
                        <i class="fa-solid fa-user-tie text-2xl text-brand-gold"></i>
                    </div>
                    <div>
                        <p class="text-xs text-blue-200 font-medium uppercase tracking-wider">KSBK Aktif</p>
                        <h2 class="text-lg font-bold" id="infoNama">Nama User</h2>
                        <p class="text-sm text-blue-100"><i class="fa-solid fa-layer-group text-brand-gold mr-1"></i> <span id="infoBidang">Bidang Kerja</span></p>
                    </div>
                </div>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 border border-red-400">
                    <i class="fa-solid fa-power-off"></i> Keluar
                </button>
            </div>

            <!-- TABS -->
            <div class="max-w-4xl mx-auto mb-6 flex bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
                <button onclick="switchTab('form')" id="tabFormBtn" class="flex-1 py-3.5 text-sm font-medium tab-btn active flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Form Input Kegiatan
                </button>
                <button onclick="switchTab('data')" id="tabDataBtn" class="flex-1 py-3.5 text-sm font-medium tab-btn flex items-center justify-center gap-2 border-l border-gray-200">
                    <i class="fa-solid fa-table-list"></i> Daftar Kegiatan
                </button>
            </div>

            <!-- TAB CONTENT: FORM -->
            <div id="tabForm" class="max-w-4xl mx-auto glass-panel rounded-2xl p-6 md:p-8 border-t-4 border-t-brand-gold">
                <h3 class="text-lg font-bold text-brand-blue border-b pb-3 mb-5" id="formTitle"><i class="fa-solid fa-plus-circle text-brand-gold mr-2"></i> Input Kegiatan Baru</h3>
                
                <form id="kegiatanForm" onsubmit="submitForm(event)">
                    <input type="hidden" id="formMode" value="add">
                    <input type="hidden" id="formId" value="">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                        <!-- SKUO -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-brand-blue mb-1.5">SKUO <span class="text-red-500">*</span></label>
                            <select id="skuoSelect" required class="w-full">
                                <option value="">Pilih SKUO...</option>
                            </select>
                        </div>

                        <!-- Nama Kegiatan -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-brand-blue mb-1.5">Nama Kegiatan <span class="text-red-500">*</span></label>
                            <input type="text" id="namaKegiatan" required class="w-full rounded-xl border-gray-300 border bg-white px-3.5 py-2.5 focus:ring-4 focus:ring-blue-100 outline-none text-gray-700 uppercase placeholder-gray-400" placeholder="Ketik nama kegiatan..." oninput="this.value = this.value.toUpperCase()">
                        </div>

                        <!-- Tanggal -->
                        <div>
                            <label class="block text-sm font-bold text-brand-blue mb-1.5">Tanggal <span class="text-red-500">*</span></label>
                            <!-- Input HTML default formatnya YYYY-MM-DD -->
                            <input type="date" id="tanggalInput" required class="w-full rounded-xl border-gray-300 border bg-white px-3.5 py-2.5 focus:ring-4 focus:ring-blue-100 outline-none text-gray-700">
                        </div>

                        <!-- Mode Kegiatan -->
                        <div>
                            <label class="block text-sm font-bold text-brand-blue mb-1.5">Mode Kegiatan <span class="text-red-500">*</span></label>
                            <select id="modeInput" required class="w-full rounded-xl border-gray-300 border bg-white px-3.5 py-2.5 focus:ring-4 focus:ring-blue-100 outline-none text-gray-700">
                                <option value="">Pilih Mode...</option>
                                <option value="Offline">Offline</option>
                                <option value="Online">Online</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>
                        </div>

                        <!-- Keterangan -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-brand-blue mb-1.5">Keterangan (Opsional)</label>
                            <textarea id="keteranganInput" rows="3" class="w-full rounded-xl border-gray-300 border bg-white px-3.5 py-2.5 focus:ring-4 focus:ring-blue-100 outline-none resize-none text-gray-700" placeholder="Tambahkan catatan jika diperlukan..."></textarea>
                        </div>
                    </div>

                    <div class="flex gap-3 pt-4 border-t border-gray-100">
                        <button type="submit" id="btnSave" class="flex-1 bg-brand-blue hover:bg-blue-800 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                            <i class="fa-solid fa-save"></i> Simpan Kegiatan
                        </button>
                        <button type="button" id="btnCancel" onclick="resetForm()" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-6 rounded-xl transition-all">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- TAB CONTENT: DATA TABLE -->
            <div id="tabData" class="max-w-6xl mx-auto glass-panel rounded-2xl p-6 hidden">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4 border-b pb-4">
                    <h3 class="text-lg font-bold text-brand-blue"><i class="fa-solid fa-list-check text-brand-gold mr-2"></i> Daftar Kegiatan</h3>
                    
                    <div class="flex gap-2 w-full md:w-auto">
                        <div class="relative flex-1 md:w-64">
                            <input type="text" id="searchTable" onkeyup="filterTable()" placeholder="Cari kegiatan..." class="w-full pl-9 pr-3 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-brand-blue outline-none text-sm bg-white">
                            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm" id="dataTable">
                        <thead class="bg-brand-blue text-white">
                            <tr>
                                <th class="px-3 py-3 font-semibold w-12 text-center">No</th>
                                <th class="px-3 py-3 font-semibold cursor-pointer hover:bg-blue-800 transition" onclick="sortTable(1)">Nama Kegiatan <i class="fa-solid fa-sort text-[10px] ml-1"></i></th>
                                <th class="px-3 py-3 font-semibold cursor-pointer hover:bg-blue-800 transition" onclick="sortTable(2)">SKUO <i class="fa-solid fa-sort text-[10px] ml-1"></i></th>
                                <th class="px-3 py-3 font-semibold cursor-pointer hover:bg-blue-800 transition w-32" onclick="sortTable(3)">Tanggal <i class="fa-solid fa-sort text-[10px] ml-1"></i></th>
                                <th class="px-3 py-3 font-semibold w-24">Mode</th>
                                <th class="px-3 py-3 font-semibold">Keterangan</th>
                                <th class="px-3 py-3 font-semibold w-24 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-200 bg-white/60">
                            <!-- Data Injected Here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // GLOBAL STATE
        let db = { akun: [], skuo: [], kegiatan: [] };
        let currentUser = { wa: "", nama: "" };
        let currentBidang = "";
        let tomSelectInstance = null;

        // DUMMY DATA UNTUK SIMULATION MODE (Gemini Canvas / Local HTML)
        const DUMMY_DATA = {
            akun: [
                { WA: "628111222333", Nama: "Ahmad Fulan", BidangKerja: "Biro IT" },
                { WA: "628111222333", Nama: "Ahmad Fulan", BidangKerja: "Biro Humas" },
                { WA: "628999888777", Nama: "Budi Santoso", BidangKerja: "Biro Keuangan" }
            ],
            skuo: [
                { BidangKerja: "Biro IT", NamaSKUO: "Pemeliharaan Server & Hosting" },
                { BidangKerja: "Biro IT", NamaSKUO: "Pengembangan Website Utama" },
                { BidangKerja: "Biro Humas", NamaSKUO: "Publikasi Media Sosial" },
                { BidangKerja: "Biro Keuangan", NamaSKUO: "Penyusunan Laporan Bulanan" }
            ],
            kegiatan: [
                { ID: "KGT-1", Timestamp: "9/10/2026 09:00:00", WA: "628111222333", Nama: "Ahmad Fulan", BidangKerja: "Biro IT", SKUO: "Pemeliharaan Server & Hosting", NamaKegiatan: "BACKUP DATABASE", Tanggal: "9/10/2026", Mode: "Online", Keterangan: "Rutin mingguan" }
            ]
        };

        // --- CORE SYSTEM & LOADING ---
        function startLoading(text = "Memuat...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('loadingOverlay').style.opacity = '1'; }, 10);
        }

        function endLoading() {
            document.getElementById('loadingOverlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('loadingOverlay').style.display = 'none'; }, 300);
        }

        function loadData() {
            if (typeof google === 'undefined') {
                // SIMULATION MODE
                console.log("Running in Simulation Mode");
                db = JSON.parse(JSON.stringify(DUMMY_DATA)); // Clone data
                setTimeout(() => {
                    initApp();
                    endLoading();
                }, 800);
            } else {
                // GAS PRODUCTION MODE
                google.script.run
                    .withSuccessHandler(res => {
                        db = res;
                        initApp();
                        endLoading();
                    })
                    .withFailureHandler(err => {
                        Swal.fire('Error', 'Gagal memuat database.', 'error');
                        endLoading();
                    })
                    .getAllData();
            }
        }

        function initApp() {
            document.getElementById('headerLogo').classList.remove('hidden');
            
            // Cek Session (Sederhana menggunakan localStorage jika diinginkan, tapi untuk ini kita reset ke login view)
            document.getElementById('loginView').classList.remove('hidden');
            
            // Inisialisasi TomSelect untuk SKUO
            tomSelectInstance = new TomSelect('#skuoSelect', {
                create: false,
                sortField: { field: "text", direction: "asc" },
                placeholder: "Ketik untuk mencari SKUO..."
            });
        }

        // --- FORMATTING HELPERS ---
        function formatWA(input) {
            let val = input.value.replace(/\D/g, ''); 
            if (val.startsWith('08')) val = '628' + val.substring(2); 
            input.value = val;
        }

        // Convert YYYY-MM-DD to D/M/YYYY (Format Simpan)
        function formatTanggalToSimpan(dateStr) {
            if(!dateStr) return "";
            const parts = dateStr.split('-');
            if(parts.length !== 3) return dateStr;
            return `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`;
        }

        // Convert D/M/YYYY to YYYY-MM-DD (Format Input Type Date)
        function formatTanggalToInput(dateStr) {
            if(!dateStr) return "";
            const parts = dateStr.split('/');
            if(parts.length !== 3) return dateStr;
            const d = parts[0].padStart(2, '0');
            const m = parts[1].padStart(2, '0');
            return `${parts[2]}-${m}-${d}`;
        }

        // Convert D/M/YYYY to DD Bulan YYYY (Format Display UI)
        function formatTanggalToDisplay(dateStr) {
            if(!dateStr) return "-";
            const parts = dateStr.split('/');
            if(parts.length !== 3) return dateStr;
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const d = parts[0].padStart(2, '0');
            const m = months[parseInt(parts[1]) - 1];
            return `${d} ${m} ${parts[2]}`;
        }

        // --- AUTH & NAVIGATION ---
        function handleLogin(e) {
            e.preventDefault();
            const wa = document.getElementById('loginWa').value;
            
            // Cari Akun
            const userAccounts = db.akun.filter(a => a.WA == wa);
            
            if (userAccounts.length === 0) {
                Swal.fire('Akses Ditolak', 'Nomor WhatsApp tidak terdaftar dalam sistem.', 'error');
                return;
            }

            currentUser.wa = wa;
            currentUser.nama = userAccounts[0].Nama;

            if (userAccounts.length === 1) {
                // Langsung masuk jika hanya 1 bidang
                enterApp(userAccounts[0].BidangKerja);
            } else {
                // Pilih bidang jika > 1
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('pilihBidangView').classList.remove('hidden');
                document.getElementById('welcomePilihBidang').innerText = `Selamat datang, ${currentUser.nama}. Pilih akses Anda:`;
                
                const listDiv = document.getElementById('listBidang');
                listDiv.innerHTML = '';
                userAccounts.forEach(acc => {
                    listDiv.innerHTML += `
                        <button onclick="enterApp('${acc.BidangKerja}')" class="w-full text-left bg-white border border-gray-200 hover:border-brand-blue hover:shadow-md p-4 rounded-xl transition-all flex items-center justify-between group">
                            <div>
                                <p class="text-xs text-gray-500 mb-0.5">Akses sebagai</p>
                                <p class="font-bold text-brand-blue">${acc.BidangKerja}</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-300 group-hover:text-brand-gold"></i>
                        </button>
                    `;
                });
            }
        }

        function enterApp(bidang) {
            currentBidang = bidang;
            
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('pilihBidangView').classList.add('hidden');
            document.getElementById('mainAppView').classList.remove('hidden');
            
            document.getElementById('infoNama').innerText = currentUser.nama;
            document.getElementById('infoBidang').innerText = currentBidang;
            
            setupForm();
            renderTable();
        }

        function logout() {
            currentUser = { wa: "", nama: "" };
            currentBidang = "";
            document.getElementById('loginWa').value = "";
            
            document.getElementById('mainAppView').classList.add('hidden');
            document.getElementById('pilihBidangView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            switchTab('form');
        }

        function switchTab(tab) {
            if (tab === 'form') {
                document.getElementById('tabForm').classList.remove('hidden');
                document.getElementById('tabData').classList.add('hidden');
                document.getElementById('tabFormBtn').classList.add('active');
                document.getElementById('tabDataBtn').classList.remove('active');
            } else {
                document.getElementById('tabForm').classList.add('hidden');
                document.getElementById('tabData').classList.remove('hidden');
                document.getElementById('tabFormBtn').classList.remove('active');
                document.getElementById('tabDataBtn').classList.add('active');
            }
        }

        // --- FORM & CRUD LOGIC ---
        function setupForm() {
            // Filter SKUO berdasarkan bidang
            const mySkuo = db.skuo.filter(s => s.BidangKerja === currentBidang);
            tomSelectInstance.clear();
            tomSelectInstance.clearOptions();
            
            mySkuo.forEach(s => {
                tomSelectInstance.addOption({value: s.NamaSKUO, text: s.NamaSKUO});
            });
            resetForm();
        }

        function submitForm(e) {
            e.preventDefault();
            
            const rawDate = document.getElementById('tanggalInput').value; // YYYY-MM-DD
            
            const payload = {
                id: document.getElementById('formId').value,
                wa: currentUser.wa,
                nama: currentUser.nama,
                bidang: currentBidang,
                skuo: document.getElementById('skuoSelect').value,
                namaKegiatan: document.getElementById('namaKegiatan').value.toUpperCase(),
                tanggal: formatTanggalToSimpan(rawDate), // D/M/YYYY
                mode: document.getElementById('modeInput').value,
                keterangan: document.getElementById('keteranganInput').value
            };

            const isEdit = document.getElementById('formMode').value === 'edit';
            startLoading(isEdit ? "Menyimpan Perubahan..." : "Menyimpan Kegiatan...");

            if (typeof google === 'undefined') {
                // SIMULATION MODE
                setTimeout(() => {
                    if (isEdit) {
                        const idx = db.kegiatan.findIndex(k => k.ID === payload.id);
                        if(idx > -1) {
                            db.kegiatan[idx] = { ...db.kegiatan[idx], ...payload, Timestamp: "Just Now" };
                        }
                    } else {
                        payload.ID = "KGT-SIM-" + Date.now();
                        payload.Timestamp = "Just Now";
                        db.kegiatan.push(payload);
                    }
                    postSubmitAction(isEdit);
                }, 800);
            } else {
                // GAS MODE
                const action = isEdit ? 'updateKegiatan' : 'saveKegiatan';
                google.script.run
                    .withSuccessHandler(res => {
                        db = res;
                        postSubmitAction(isEdit);
                    })
                    .withFailureHandler(err => {
                        Swal.fire('Error', 'Gagal menyimpan data.', 'error');
                        endLoading();
                    })[action](payload);
            }
        }

        function postSubmitAction(isEdit) {
            endLoading();
            Swal.fire({
                icon: 'success',
                title: 'Alhamdulillah',
                text: isEdit ? 'Kegiatan berhasil diperbarui.' : 'Kegiatan berhasil ditambahkan.',
                timer: 1500,
                showConfirmButton: false
            });
            resetForm();
            renderTable();
            switchTab('data');
        }

        function editData(id) {
            const data = db.kegiatan.find(k => k.ID === id);
            if (!data) return;

            document.getElementById('formMode').value = "edit";
            document.getElementById('formId').value = data.ID;
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen text-brand-gold mr-2"></i> Edit Kegiatan';
            
            tomSelectInstance.setValue(data.SKUO);
            document.getElementById('namaKegiatan').value = data.NamaKegiatan;
            document.getElementById('tanggalInput').value = formatTanggalToInput(data.Tanggal);
            document.getElementById('modeInput').value = data.Mode;
            document.getElementById('keteranganInput').value = data.Keterangan || "";
            
            document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-save"></i> Update Kegiatan';
            document.getElementById('btnCancel').classList.remove('hidden');
            
            switchTab('form');
        }

        function deleteData(id) {
            Swal.fire({
                title: 'Hapus Kegiatan?',
                text: "Data yang dihapus akan tercatat di riwayat.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: 'Ya, Hapus!'
            }).then((result) => {
                if (result.isConfirmed) {
                    startLoading("Menghapus...");
                    
                    if (typeof google === 'undefined') {
                        setTimeout(() => {
                            db.kegiatan = db.kegiatan.filter(k => k.ID !== id);
                            endLoading();
                            Swal.fire('Terhapus!', 'Data berhasil dihapus.', 'success');
                            renderTable();
                        }, 800);
                    } else {
                        google.script.run
                            .withSuccessHandler(res => {
                                db = res;
                                endLoading();
                                Swal.fire('Terhapus!', 'Data berhasil dihapus.', 'success');
                                renderTable();
                            })
                            .withFailureHandler(err => {
                                Swal.fire('Error', 'Gagal menghapus data.', 'error');
                                endLoading();
                            })
                            .deleteKegiatan(id, currentUser.wa, currentUser.nama, currentBidang);
                    }
                }
            });
        }

        function resetForm() {
            document.getElementById('kegiatanForm').reset();
            tomSelectInstance.clear();
            document.getElementById('formMode').value = "add";
            document.getElementById('formId').value = "";
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus-circle text-brand-gold mr-2"></i> Input Kegiatan Baru';
            document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-save"></i> Simpan Kegiatan';
            document.getElementById('btnCancel').classList.add('hidden');
        }

        // --- TABLE LOGIC ---
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // Filter kegiatan sesuai bidang yang aktif
            const myData = db.kegiatan.filter(k => k.BidangKerja === currentBidang);
            
            if (myData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-500 italic">Belum ada kegiatan yang diinput.</td></tr>`;
                return;
            }

            // Urutkan dari yang terbaru (asumsi ID mengandung timestamp / teratas)
            myData.reverse().forEach((k, index) => {
                // Label warna untuk mode
                let modeClass = "bg-gray-100 text-gray-700";
                if(k.Mode === "Online") modeClass = "bg-blue-100 text-blue-700";
                if(k.Mode === "Offline") modeClass = "bg-green-100 text-green-700";
                if(k.Mode === "Hybrid") modeClass = "bg-purple-100 text-purple-700";

                tbody.innerHTML += `
                    <tr class="hover:bg-blue-50/50 transition-colors">
                        <td class="px-3 py-3 text-center text-gray-500 text-xs">${index + 1}</td>
                        <td class="px-3 py-3 font-bold text-brand-blue text-sm keep-multiline">${k.NamaKegiatan}</td>
                        <td class="px-3 py-3 text-gray-700 text-xs keep-multiline">${k.SKUO}</td>
                        <td class="px-3 py-3 text-gray-700 text-xs font-medium">${formatTanggalToDisplay(k.Tanggal)}</td>
                        <td class="px-3 py-3"><span class="${modeClass} px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider">${k.Mode}</span></td>
                        <td class="px-3 py-3 text-gray-600 text-xs keep-multiline">${k.Keterangan || '-'}</td>
                        <td class="px-3 py-3 text-center">
                            <div class="flex justify-center gap-2">
                                <button onclick="editData('${k.ID}')" class="text-brand-gold hover:text-yellow-600 bg-yellow-50 p-1.5 rounded" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteData('${k.ID}')" class="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function filterTable() {
            const input = document.getElementById("searchTable").value.toLowerCase();
            const rows = document.getElementById("tableBody").getElementsByTagName("tr");
            
            for (let i = 0; i < rows.length; i++) {
                if (rows[i].cells.length > 1) { // abaikan baris kosong
                    const text = rows[i].textContent.toLowerCase();
                    rows[i].style.display = text.includes(input) ? "" : "none";
                }
            }
        }

        let sortAsc = false;
        function sortTable(colIndex) {
            const table = document.getElementById("dataTable");
            let rows, switching, i, x, y, shouldSwitch;
            switching = true; 
            sortAsc = !sortAsc;
            
            while (switching) {
                switching = false; 
                rows = table.rows;
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[colIndex];
                    y = rows[i + 1].getElementsByTagName("TD")[colIndex];
                    
                    if (x && y) {
                        let valX = x.textContent.toLowerCase();
                        let valY = y.textContent.toLowerCase();
                        
                        if (sortAsc ? valX > valY : valX < valY) {
                            shouldSwitch = true; 
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                }
            }
        }
    </script>
</body>
</html>
